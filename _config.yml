# Site settings
title: ELIFKULA
description:

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

collections:
  gunlukler:
    output: true
    permalink: /gunlukler/:name/

defaults:
  - scope:
      path: ""
      type: gunlukler
    values:
      layout: post

# Encoding
encoding: utf-8

# Turkish timezone
timezone: Europe/Istanbul

# Exclude from build
exclude:
  - design.md
  - README.md
  - Gemfile
  - Gemfile.lock

url: "https://elifnkula.com.tr"
baseurl: ""
